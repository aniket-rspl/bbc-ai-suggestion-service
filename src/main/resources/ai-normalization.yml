            - remaining amount
            - remaining amt
            - remaining balance
            - balance remaining
            - unpaid amount
            - receivable amount
            - receivable amt
            - open amount
            - open amt

        - canonical: invoice
          aliases:
            - inv
            - invoice

        - canonical: date
          aliases:
            - dt
            - date

        - canonical: document
          aliases:
            - doc
            - document

        - canonical: number
          aliases:
            - num
            - no
            - no.
            - nbr
            - number
            - "#"

        - canonical: reference
          aliases:
            - ref
            - reference

        - canonical: transaction
          aliases:
            - txn
            - trx
            - trans
            - transaction

        - canonical: type
          aliases:
            - tp
            - typ
            - type

        - canonical: code
          aliases:
            - cd
            - code

        - canonical: customer
          aliases:
            - cust
            - customer

        - canonical: name
          aliases:
            - nm
            - name

        - canonical: amount
          aliases:
