spring:
  application:
    name: bbc-ai-suggestion-service
  profiles:
    active: local
  config:
    import:
      - optional:classpath:ai-normalization.yml

  ai:
    ollama:
      base-url: http://172.16.8.90:11434
      chat:
        options:
          model: gemma3:4b
          temperature: 0.1
      embedding:
        options:
          model: mxbai-embed-large:latest
    model:
      embedding: ollama
    retry:
      max-attempts: 1

server:
  port: 8085

bbc:
  ai:
    prompt-version: v3-deterministic-001